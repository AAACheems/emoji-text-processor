<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Emoji 智能文本处理器 - 为您的文字自动添加表情符号，智能匹配 emoji">
    <meta name="theme-color" content="#0b0a1a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>">
    <title>Emoji 智能文本处理器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 背景装饰：流动光斑 + 网格 -->
    <div class="bg-scene" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="bg-grid"></div>
        <div class="bg-noise"></div>
    </div>

    <div class="app">
        <!-- 顶部 -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true"><span>😊</span><i>✨</i></div>
                <div class="brand-text">
                    <h1>Emoji 智能文本处理器</h1>
                    <p>让文字更生动 · 语义匹配 · 一键生成</p>
                </div>
            </div>
            <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
                <span class="theme-icon" aria-hidden="true">🌙</span>
                <span class="theme-text">暗色</span>
            </button>
        </header>

        <main class="main-content">

            <!-- 输入卡片 -->
            <section class="card input-card">
                <div class="card-head">
                    <h2><span class="card-icon" aria-hidden="true">✏️</span>输入文本</h2>
                    <span class="card-hint">Ctrl + Enter 快捷处理</span>
                </div>

                <div class="textarea-shell">
                    <textarea
                        id="input-text"
                        class="input-textarea"
                        placeholder="在这里输入您想要处理的文本内容…&#10;&#10;例如：今天天气真好，我想去公园散步，然后喝一杯咖啡。"
                        rows="6"
                        maxlength="2000"
                        spellcheck="false"></textarea>
                    <div class="textarea-toolbar">
                        <label class="live-toggle" for="live-toggle" title="开启后输入即自动处理">
                            <input type="checkbox" id="live-toggle">
                            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                            <span class="live-label">实时处理</span>
                        </label>
                        <span id="char-count" class="char-count">0 / 2000</span>
                    </div>
                </div>

                <div class="examples">
                    <span class="examples-label">💡 试试这些：</span>
                    <div class="examples-chips">
                        <button type="button" class="example-chip" data-example="今天天气真好，我想去公园散步，然后喝一杯咖啡，心情超级棒！">🌤️ 天气心情</button>
                        <button type="button" class="example-chip" data-example="周五晚上我要和朋友吃火锅、看电影，周末一起去爬山！">🎬 周末计划</button>
                        <button type="button" class="example-chip" data-example="项目终于上线了，感谢大家这段时间的辛苦付出，我爱你们！">🎉 工作日常</button>
                    </div>
                </div>
            </section>

            <!-- 操作按钮 -->
            <div class="actions">
                <button id="process-btn" class="btn btn-primary" disabled>
                    <span class="btn-icon" aria-hidden="true">✨</span>
                    <span class="btn-text">智能处理</span>
                    <kbd class="btn-kbd">Ctrl↵</kbd>
                </button>
                <button id="clear-btn" class="btn btn-ghost" disabled>
                    <span class="btn-icon" aria-hidden="true">🧹</span>
                    <span class="btn-text">清除</span>
                </button>
                <button id="copy-btn" class="btn btn-ghost" disabled>
                    <span class="btn-icon" aria-hidden="true">📋</span>
                    <span class="btn-text">复制结果</span>
                </button>
            </div>

            <!-- 结果卡片 -->
            <section class="card output-card">
                <div class="card-head">
                    <h2><span class="card-icon" aria-hidden="true">🎨</span>处理结果</h2>
                    <div class="result-meta">
                        <span id="result-badge" class="badge">0 个 emoji</span>
                        <span id="result-time" class="time-note">—</span>
                    </div>
                </div>

                <div class="output-wrap">
                    <div id="output-placeholder" class="output-placeholder">
                        <div class="placeholder-emoji" aria-hidden="true">📭</div>
                        <p class="placeholder-title">等待处理</p>
                        <p class="placeholder-sub">输入文字后点击「智能处理」，或开启实时处理</p>
                    </div>
                    <div id="output-content" class="output-content" hidden>
                        <div id="result-text" class="result-text"></div>
                    </div>
                </div>
            </section>

            <!-- Emoji 面板 -->
            <section class="card emoji-card">
                <div class="card-head">
                    <h2><span class="card-icon" aria-hidden="true">😀</span>常用 Emoji</h2>
                    <button id="custom-emoji-btn" class="chip-btn" title="添加自定义 emoji">
                        <span aria-hidden="true">＋</span>自定义
                    </button>
                </div>

                <div id="emoji-grid" class="emoji-grid" aria-label="常用 emoji 快捷插入"></div>

                <div id="custom-emoji-section" class="custom-section" hidden>
                    <div class="custom-head">
                        <h3>我的自定义 Emoji</h3>
                        <button id="close-custom-emoji" class="icon-close" title="关闭" aria-label="关闭">×</button>
                    </div>
                    <div class="custom-input-row">
                        <input type="text" id="custom-emoji-input" class="custom-emoji-input" placeholder="输入一个 emoji，如 🎉" maxlength="8" autocomplete="off">
                        <button id="add-custom-emoji" class="btn btn-small btn-primary">添加</button>
                    </div>
                    <div id="custom-emoji-list" class="custom-emoji-list"></div>
                    <p id="custom-empty" class="custom-empty">还没有自定义 emoji，添加一个试试吧～</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>✨ 零依赖 · 本地运行 · 打开即用</p>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span class="toast-icon" aria-hidden="true"></span>
        <span class="toast-message"></span>
        <span class="toast-progress" aria-hidden="true"></span>
    </div>

    <script src="script.js"></script>
    <noscript>
        <div style="text-align:center;padding:2rem;color:#999;">⚠️ 您的浏览器未启用 JavaScript，本应用需要 JavaScript 才能运行。</div>
    </noscript>
</body>
</html>

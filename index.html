<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji 智能文本处理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="logo">
                    <span class="logo-icon">😊</span>
                    <h1>Emoji 智能处理</h1>
                </div>
                <div class="header-controls">
                    <button id="theme-toggle" class="theme-toggle" title="切换主题">
                        <span class="theme-icon">🌙</span>
                        <span class="theme-text">暗模式</span>
                    </button>
                </div>
            </div>
            <p class="subtitle">让您的文字更加生动有趣</p>
        </header>

        <main class="main-content">
            <div class="input-section">
                <label for="input-text" class="section-label">
                    <span class="label-icon">✏️</span>
                    <span>输入文本</span>
                </label>
                <textarea 
                    id="input-text" 
                    class="input-textarea"
                    placeholder="在这里输入您想要处理的文本内容...&#10;&#10;例如：今天天气真好，我想去公园散步，然后喝一杯咖啡。&#10;&#10;系统会自动为您匹配合适的 emoji！"
                    rows="6"></textarea>
                <div class="input-footer">
                    <span class="char-count">0 / 2000</span>
                    <span class="hint">💡 输入日常文本，系统会智能匹配 emoji</span>
                </div>
            </div>

            <div class="button-section">
                <button id="process-btn" class="btn btn-primary">
                    <span class="btn-icon">✨</span>
                    <span>智能处理</span>
                </button>
                <button id="clear-btn" class="btn btn-secondary">
                    <span class="btn-icon">🗑️</span>
                    <span>清除内容</span>
                </button>
                <button id="copy-btn" class="btn btn-outline" disabled>
                    <span class="btn-icon">📋</span>
                    <span>复制结果</span>
                </button>
            </div>

            <div class="output-section" id="output-section">
                <label class="section-label">
                    <span class="label-icon">🎨</span>
                    <span>处理结果</span>
                    <span class="result-badge" id="result-badge">0 个 emoji</span>
                </label>
                <div class="output-container">
                    <div class="output-placeholder" id="output-placeholder">
                        <span class="placeholder-icon">📭</span>
                        <p>处理结果将在这里显示</p>
                        <p class="placeholder-hint">点击「智能处理」按钮开始</p>
                    </div>
                    <div class="output-content" id="output-content" style="display: none;">
                        <div class="result-text" id="result-text"></div>
                    </div>
                </div>
            </div>

            <div class="emoji-preview">
                <div class="preview-header">
                    <h3 class="preview-title">常用 Emoji 预览</h3>
                    <button id="custom-emoji-btn" class="custom-emoji-btn" title="添加自定义 emoji">
                        <span class="plus-icon">+</span>
                        <span>添加自定义</span>
                    </button>
                </div>
                <div class="emoji-grid" id="emoji-grid">
                    <!-- Emoji 按钮将通过 JavaScript 动态生成 -->
                </div>
                <div class="custom-emoji-section" id="custom-emoji-section" style="display: none;">
                    <div class="custom-emoji-header">
                        <h4 class="custom-emoji-title">我的自定义 Emoji</h4>
                        <button id="close-custom-emoji" class="close-btn" title="关闭">×</button>
                    </div>
                    <div class="custom-emoji-input-area">
                        <input type="text" id="custom-emoji-input" class="custom-emoji-input" placeholder="输入一个 emoji（如 🎉）">
                        <button id="add-custom-emoji" class="btn btn-sm btn-primary">添加</button>
                    </div>
                    <div class="custom-emoji-list" id="custom-emoji-list">
                        <!-- 自定义 emoji 将显示在这里 -->
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>使用 AI 技术为您的文本智能添加表情符号</p>
        </footer>
    </div>

    <div class="toast" id="toast">
        <span class="toast-icon">✅</span>
        <span class="toast-message">复制成功！</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
